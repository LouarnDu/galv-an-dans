name: Alerte Fest-Noz

on:
  schedule:
    # Une fois par semaine, le lundi à 2h UTC (~3h ou 4h heure française selon la saison)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      forcer_envoi:
        description: "Ignorer l'anti-doublon et renvoyer toutes les alertes actuelles (pratique pour tester)"
        type: boolean
        default: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Récupération des événements déjà notifiés (cache)
        uses: actions/cache/restore@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
          restore-keys: |
            notified-

      - name: Exécution du script d'alerte
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          USERS_API_URL: ${{ secrets.USERS_API_URL }}
          USERS_API_KEY: ${{ secrets.USERS_API_KEY }}
          FORCER_ENVOI: ${{ github.event.inputs.forcer_envoi }}
        run: python festnoz_alerte.py

      - name: Sauvegarde des événements notifiés (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
