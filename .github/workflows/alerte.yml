name: Alerte Fest-Noz

on:
  schedule:
    # Lundi, mercredi, vendredi à 2h UTC (~3h ou 4h heure française selon la saison)
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Récupération des événements déjà notifiés (cache)
        uses: actions/cache/restore@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
          restore-keys: |
            notified-

      - name: Écriture de config.json à partir du secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Exécution du script d'alerte
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python festnoz_alerte.py

      - name: Sauvegarde des événements notifiés (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
