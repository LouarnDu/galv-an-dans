name: Alerte Fest-Noz

on:
  schedule:
    # Une fois par semaine, le lundi à 2h UTC (~3h ou 4h heure française selon la saison)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      forcer_envoi:
        description: "Ignorer l'anti-doublon et renvoyer toutes les alertes actuelles (pratique pour tester)"
        type: boolean
        default: false
      utiliser_cache:
        description: "Réutiliser les événements du dernier run au lieu de rappeler Tamm-Kreiz/OSRM (pratique pour tester)"
        type: boolean
        default: false
      utilisateur_id:
        description: "Traiter seulement cet utilisateur (id) — déclenché automatiquement par le site à l'inscription, laisser vide pour tout le monde"
        type: string
        default: ""

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Récupération des événements déjà notifiés (cache)
        uses: actions/cache/restore@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
          restore-keys: |
            notified-

      - name: Récupération du cache d'événements (pour les tests)
        uses: actions/cache/restore@v4
        with:
          path: cache_evenements.json
          key: cache-evenements-${{ github.run_id }}
          restore-keys: |
            cache-evenements-

      - name: Exécution du script d'alerte
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          USERS_API_URL: ${{ secrets.USERS_API_URL }}
          USERS_API_KEY: ${{ secrets.USERS_API_KEY }}
          FORCER_ENVOI: ${{ github.event.inputs.forcer_envoi }}
          UTILISER_CACHE: ${{ github.event.inputs.utiliser_cache }}
          UTILISATEUR_ID: ${{ github.event.inputs.utilisateur_id }}
        run: python festnoz_alerte.py

      - name: Sauvegarde des événements notifiés (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}

      - name: Sauvegarde du cache d'événements
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_evenements.json
          key: cache-evenements-${{ github.run_id }}
