<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Galv an dañs — mes préférences</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div id="selecteur-langue"></div>

    <h1 data-i18n="titre_edit">Mes préférences</h1>
    <p class="subtitle" id="subtitle" data-i18n="chargement">Chargement...</p>

    <form id="form-edition" hidden>
      <label>
        <span data-i18n="label_prenom">Ton prénom</span>
        <input type="text" name="nom" required maxlength="80" />
      </label>

      <label>
        <span data-i18n="label_email">Ton email</span>
        <input type="email" name="email" required maxlength="200" />
      </label>

      <label>
        <span data-i18n="label_profil">URL de ton profil Tamm-Kreiz</span>
        <input
          type="url"
          name="profil_url"
          required
          pattern="https://(www\.)?tamm-kreiz\.bzh/.*"
        />
      </label>

      <label>
        <span data-i18n="label_adresse">Ton adresse</span>
        <input type="text" name="adresse" required maxlength="200" />
      </label>

      <label>
        <span data-i18n="label_rayon">Rayon (minutes de route)</span>
        <input type="number" name="rayon_minutes" required min="1" max="300" />
      </label>

      <label style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" name="repeter_evenements" style="width: auto;" />
        <span data-i18n="label_repeter">Me renvoyer les mêmes événements à chaque email (plutôt qu'une seule fois)</span>
      </label>

      <button type="submit" class="primary" data-i18n="bouton_enregistrer">Enregistrer</button>
      <button type="button" class="danger" id="btn-supprimer" data-i18n="bouton_supprimer">Supprimer mon compte</button>
    </form>

    <div id="message" class="message" hidden></div>
  </div>

  <script src="i18n.js"></script>
  <script>
    initSelecteurLangue(document.getElementById("selecteur-langue"));

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const form = document.getElementById("form-edition");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = `message ${type}`;
      message.hidden = false;
    }

    if (!id) {
      subtitle.removeAttribute("data-i18n");
      subtitle.textContent = window.TEXTES[window.langueActuelle].lien_invalide_id;
    } else {
      chargerPreferences();
    }

    async function chargerPreferences() {
      try {
        const resp = await fetch(`/api/u/${id}`, { headers: { "X-Lang": window.langueActuelle } });
        const data = await resp.json();
        if (!resp.ok) {
          subtitle.removeAttribute("data-i18n");
          subtitle.textContent = data.error;
          return;
        }
        for (const champ of ["nom", "email", "profil_url", "adresse", "rayon_minutes"]) {
          form.elements[champ].value = data[champ];
        }
        form.elements.repeter_evenements.checked = Boolean(data.repeter_evenements);
        if (data.langue) appliquerLangue(data.langue);
        subtitle.removeAttribute("data-i18n");
        subtitle.textContent = window.TEXTES[window.langueActuelle].pret_a_modifier;
        form.hidden = false;
      } catch {
        subtitle.removeAttribute("data-i18n");
        subtitle.textContent = window.TEXTES[window.langueActuelle].erreur_reseau;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const bouton = form.querySelector("button[type=submit]");
      bouton.disabled = true;
      message.hidden = true;

      const donnees = Object.fromEntries(new FormData(form).entries());
      donnees.rayon_minutes = Number(donnees.rayon_minutes);
      donnees.repeter_evenements = form.repeter_evenements.checked;
      donnees.langue = window.langueActuelle;

      try {
        const resp = await fetch(`/api/u/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Lang": window.langueActuelle },
          body: JSON.stringify(donnees),
        });
        const data = await resp.json();
        if (!resp.ok) {
          afficherMessage(data.error, "error");
        } else {
          afficherMessage(window.TEXTES[window.langueActuelle].prefs_enregistrees, "ok");
        }
      } catch {
        afficherMessage(window.TEXTES[window.langueActuelle].erreur_reseau, "error");
      } finally {
        bouton.disabled = false;
      }
    });

    document.getElementById("btn-supprimer").addEventListener("click", async () => {
      if (!confirm(window.TEXTES[window.langueActuelle].confirm_suppression)) return;
      try {
        const resp = await fetch(`/api/u/${id}`, {
          method: "DELETE",
          headers: { "X-Lang": window.langueActuelle },
        });
        const data = await resp.json();
        if (!resp.ok) {
          afficherMessage(data.error, "error");
        } else {
          form.hidden = true;
          subtitle.removeAttribute("data-i18n");
          subtitle.textContent = window.TEXTES[window.langueActuelle].compte_supprime;
        }
      } catch {
        afficherMessage(window.TEXTES[window.langueActuelle].erreur_reseau, "error");
      }
    });
  </script>
</body>
</html>
